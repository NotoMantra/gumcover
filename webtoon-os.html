<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webtoon, Comic and Manga Production OS</title>
<style>
  :root{
    --ink:#0E0E13;
    --ink-2:#16161f;
    --gutter:#FFFFFF;
    --paper:#EDEDF2;
    --muted:#8A8A9C;
    --violet:#7C3AED;
    --violet-lift:#9061F9;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{
    background:transparent;
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{padding:2px}

  .strip{
    display:grid;
    grid-template-columns:248px 1fr 210px;
    gap:3px;
    background:var(--gutter);
    border:3px solid var(--gutter);
    border-radius:3px;
    overflow:hidden;
    text-decoration:none;
    min-height:168px;
    box-shadow:0 1px 0 rgba(14,14,19,.18);
  }

  .panel{background:var(--ink);display:flex}

  /* panel one: the cover */
  .panel--art{padding:10px;overflow:hidden;align-items:center;justify-content:center}
  .panel--art img{
    max-width:100%;max-height:100%;
    width:auto;height:auto;
    object-fit:contain;
    display:block;
  }

  /* panel two: the pitch */
  .panel--say{
    flex-direction:column;
    justify-content:center;
    gap:11px;
    padding:22px 26px;
    background:
      radial-gradient(120% 160% at 0% 0%, var(--ink-2) 0%, var(--ink) 62%);
  }

  .kicker{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--muted);
    text-transform:uppercase;
  }

  h1{
    font-size:23px;
    line-height:1.15;
    font-weight:750;
    letter-spacing:-.017em;
    color:var(--paper);
    max-width:30ch;
  }

  .beats{
    display:flex;
    flex-wrap:wrap;
    gap:6px 7px;
    list-style:none;
  }
  .beats li{
    font-size:12px;
    line-height:1;
    color:#C9C9D6;
    padding:6px 10px 7px;
    border:1px solid rgba(237,237,242,.16);
    border-radius:2px;
    white-space:nowrap;
  }

  /* panel three: the action */
  .panel--act{
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:13px;
    padding:22px 20px;
    text-align:center;
  }

  .scale{
    font-size:15px;
    font-weight:600;
    letter-spacing:-.01em;
    color:var(--paper);
    line-height:1.35;
  }
  .scale span{
    display:block;
    font-size:11.5px;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--muted);
    margin-top:6px;
  }

  .cta{
    display:inline-block;
    padding:11px 21px;
    border-radius:2px;
    background:var(--violet);
    color:#fff;
    font-size:13.5px;
    font-weight:640;
    letter-spacing:.005em;
    transition:background .18s ease;
  }
  .strip:hover .cta,
  .strip:focus-visible .cta{background:var(--violet-lift)}
  .strip:focus-visible{outline:3px solid var(--violet-lift);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .cta{transition:none}
  }

  @media (max-width:880px){
    .strip{grid-template-columns:200px 1fr 176px}
    h1{font-size:20px}
    .beats li:nth-child(3){display:none}
  }

  @media (max-width:660px){
    .strip{grid-template-columns:1fr;min-height:0}
    .panel--art{height:auto;padding:12px 12px 6px}
    .panel--art img{width:100%;max-height:none}
    .panel--say{padding:20px 22px}
    .panel--act{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;text-align:left}
    .scale{font-size:14px}
    .beats li:nth-child(3){display:block}
  }
</style>
</head>
<body>

<a class="strip"
   href="https://notomantra.gumroad.com/l/webtoon-comic-manga-production-os"
   target="_blank" rel="noopener">

  <div class="panel panel--art">
    <img src="https://public-files.gumroad.com/0mtiqk8mwomshf0zzrq808g6xaol"
         alt="Webtoon, Comic and Manga Production OS">
  </div>

  <div class="panel panel--say">
    <p class="kicker">Ready for the full system</p>
    <h1>Webtoon, Comic and Manga Production OS</h1>
    <ul class="beats">
      <li>Buffer runway in weeks</li>
      <li>Reuse art, stop redrawing</li>
      <li>Every platform, one calendar</li>
    </ul>
  </div>

  <div class="panel panel--act">
    <p class="scale">8 databases, 9 pages<span>One time. No subscription.</span></p>
    <span class="cta">Get the full OS</span>
  </div>

</a>

</body>
</html>
