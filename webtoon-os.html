<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webtoon, Comic &amp; Manga Production OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fbf9ff; --bg2:#f3edff; --ink:#2a2140; --muted:#6b5f86;
    --accent:#7c5cd6; --accent-deep:#5b3fb8; --chip:#ece4ff; --line:#e4dbfb;
    --speed:90s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg1)}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden}

  a.wrap{
    position:relative;display:flex;align-items:stretch;height:100vh;min-height:220px;
    text-decoration:none;color:inherit;overflow:hidden;border-radius:14px;
    background:linear-gradient(120deg,var(--bg1) 0%,var(--bg2) 55%,#f7f2ff 100%);
    border:1px solid var(--line);
  }
  /* slow drifting glow */
  .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
  .g1{width:380px;height:380px;background:#e2d4ff;top:-160px;left:-80px;animation:drift1 26s ease-in-out infinite alternate}
  .g2{width:420px;height:420px;background:#efe6ff;bottom:-220px;left:38%;animation:drift2 32s ease-in-out infinite alternate}
  .g3{width:300px;height:300px;background:#dccbff;top:-120px;right:-60px;animation:drift1 30s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(90px,50px) scale(1.12)}}
  @keyframes drift2{to{transform:translate(-110px,-40px) scale(1.08)}}

  /* copy panel */
  .copy{
    position:relative;z-index:2;flex:0 0 34%;min-width:300px;max-width:440px;
    padding:clamp(16px,3.2vh,30px) clamp(18px,2.4vw,34px);
    display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.6vh,12px);
  }
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(19px,4.4vh,30px);line-height:1.15;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--accent-deep)}
  .sub{font-size:clamp(12px,2.1vh,14px);line-height:1.5;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:500;color:var(--accent-deep);background:var(--chip);padding:4px 10px;border-radius:999px}
  .cta{display:flex;align-items:center;gap:12px;margin-top:2px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
    font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;
    box-shadow:0 6px 18px -6px rgba(124,92,214,.55);transition:background .25s,transform .25s;
  }
  a.wrap:hover .btn{background:var(--accent-deep);transform:translateY(-1px)}
  .btn span{transition:transform .25s}
  a.wrap:hover .btn span{transform:translateX(3px)}

  /* carousel */
  .stage{
    position:relative;z-index:1;flex:1;overflow:hidden;display:flex;align-items:center;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
  }
  .track{display:flex;gap:18px;width:max-content;height:100%;align-items:center;
    padding:clamp(12px,3vh,22px) 0;animation:slide var(--speed) linear infinite}
  a.wrap:hover .track{animation-play-state:paused}
  @keyframes slide{to{transform:translateX(calc(-50% - 9px))}}
  .frame{
    height:100%;aspect-ratio:16/10;flex:0 0 auto;background:#fff;border-radius:10px;
    border:1px solid var(--line);box-shadow:0 10px 28px -14px rgba(76,52,150,.35);
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;
  }
  .frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:6px}

  @media (prefers-reduced-motion:reduce){ .track{--speed:180s} .glow{animation:none} }

  /* narrow embeds: stack */
  @media (max-width:760px){
    body{overflow:auto}
    a.wrap{flex-direction:column;height:auto}
    .copy{max-width:none;min-width:0;flex:none}
    .stage{height:200px;flex:none}
  }
</style>
</head>
<body>
<a class="wrap" href="https://notomantra.gumroad.com/l/webtoon-comic-manga-production-os" target="_blank" rel="noopener">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

  <div class="copy">
    <div class="eyebrow">Webtoon, Comic &amp; Manga OS</div>
    <h1>From script to panel <em>to published episode.</em></h1>
    <p class="sub">Series, episodes, scripts, characters and your release schedule, all connected. Stay ahead of every upload.</p>
    <div class="chips">
      <span class="chip">Scripts &amp; panels</span>
      <span class="chip">Characters</span>
      <span class="chip">Release schedule</span>
    </div>
    <div class="cta">
      <span class="btn">Get the full system <span>→</span></span>
    </div>
  </div>

  <div class="stage">
    <div class="track">
      <div class="frame"><img src="https://public-files.gumroad.com/0mtiqk8mwomshf0zzrq808g6xaol" alt="Webtoon Production OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/4tz0bwqewuot9hz1z4g6oq8zxtv0" alt="Webtoon Production OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/5lip2yvohg7sxbr0xszmlygdife5" alt="Webtoon Production OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/ygry3lrziabvykkgkfut1syblq6e" alt="Webtoon Production OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/6u0rrc1zjen2ny968ueoymoz0ezq" alt="Webtoon Production OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/c4nhut1hzwtsnoqdksxo9uddjf6a" alt="Webtoon Production OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/5v0ufyjjjd6ppzcmybaabc3o5tls" alt="Webtoon Production OS screen"></div>
      <!-- duplicate set for a seamless loop -->
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/0mtiqk8mwomshf0zzrq808g6xaol" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/4tz0bwqewuot9hz1z4g6oq8zxtv0" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/5lip2yvohg7sxbr0xszmlygdife5" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/ygry3lrziabvykkgkfut1syblq6e" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/6u0rrc1zjen2ny968ueoymoz0ezq" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/c4nhut1hzwtsnoqdksxo9uddjf6a" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/5v0ufyjjjd6ppzcmybaabc3o5tls" alt=""></div>
    </div>
  </div>
</a>
</body>
</html>
