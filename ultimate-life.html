<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADHD Life OS Ultimate</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a.product-link {
      display: block;
      text-decoration: none;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      max-width: 600px;
      width: 100%;
      position: relative;
    }

    a.product-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
    }

    a.product-link img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }

    .upgrade-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;

      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      padding: 12px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .upgrade-text {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .upgrade-text .spark {
      flex-shrink: 0;
      font-size: 13px;
      color: rgba(255,255,255,0.95);
    }

    .upgrade-text span:last-child {
      color: rgba(255,255,255,0.92);
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 500;
      line-height: 1.35;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upgrade-btn {
      flex-shrink: 0;

      background: #fff;
      color: #111;

      font-size: clamp(10px, 2.2vw, 12px);
      font-weight: 600;

      padding: 7px 14px;
      border-radius: 7px;

      letter-spacing: 0.2px;
      transition: background 0.2s ease;
    }

    a.product-link:hover .upgrade-btn {
      background: #ececec;
    }
  </style>
</head>

<body>

  <a
    class="product-link"
    href="https://notomantra.gumroad.com/l/adhd-life-pro"
    target="_blank"
    rel="noopener"
  >

    <img
      src="https://public-files.gumroad.com/f2m3s6pwju4yq1ztghqmdo8ugkq9"
      alt="ADHD Life OS Ultimate"
    >

    <div class="upgrade-bar">

      <div class="upgrade-text">
        <span class="spark">✦</span>

        <span>
          Unlock stuck-task labels, energy modes, reset systems, routines, money, home & complete ADHD life dashboards
        </span>
      </div>

      <div class="upgrade-btn">
        Upgrade →
      </div>

    </div>

  </a>

</body>
</html>
