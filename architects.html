<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Firm OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2a2a2c; --bg2:#323235; --ink:#f2f1ee; --muted:#b3b1ac;
    --accent:#f2f1ee; --accent-deep:#ffffff; --chip:#3d3d41; --line:#434347;
    --speed:70s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg1)}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden}

  a.wrap{
    position:relative;display:flex;align-items:stretch;height:100vh;min-height:220px;
    text-decoration:none;color:inherit;overflow:hidden;border-radius:14px;
    background:linear-gradient(120deg,var(--bg1) 0%,var(--bg2) 55%,#2e2e31 100%);
    border:1px solid var(--line);
  }
  /* slow drifting glow */
  .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;pointer-events:none}
  .g1{width:380px;height:380px;background:#3a3a3e;top:-160px;left:-80px;animation:drift1 26s ease-in-out infinite alternate}
  .g2{width:420px;height:420px;background:#35353a;bottom:-220px;left:38%;animation:drift2 32s ease-in-out infinite alternate}
  .g3{width:300px;height:300px;background:#404045;top:-120px;right:-60px;animation:drift1 30s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(90px,50px) scale(1.12)}}
  @keyframes drift2{to{transform:translate(-110px,-40px) scale(1.08)}}

  /* copy panel */
  .copy{
    position:relative;z-index:2;flex:0 0 34%;min-width:300px;max-width:440px;
    padding:clamp(16px,3.2vh,30px) clamp(18px,2.4vw,34px);
    display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.6vh,12px);
  }
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a9a6a0;font-weight:600}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(19px,4.4vh,30px);line-height:1.15;letter-spacing:-.01em}
  h1 em{font-style:normal;color:#cfccc5}
  .sub{font-size:clamp(12px,2.1vh,14px);line-height:1.5;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:500;color:#e4e2dd;background:var(--chip);padding:4px 10px;border-radius:999px}
  .cta{display:flex;align-items:center;gap:12px;margin-top:2px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#1f1f21;
    font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;
    box-shadow:0 6px 18px -6px rgba(0,0,0,.45);transition:background .25s,transform .25s;
  }
  a.wrap:hover .btn{background:var(--accent-deep);transform:translateY(-1px)}
  .btn span{transition:transform .25s}
  a.wrap:hover .btn span{transform:translateX(3px)}

  /* carousel */
  .stage{
    position:relative;z-index:1;flex:1;overflow:hidden;display:flex;align-items:center;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
  }
  .track{display:flex;gap:18px;width:max-content;height:100%;align-items:center;
    padding:clamp(12px,3vh,22px) 0;animation:slide var(--speed) linear infinite}
  a.wrap:hover .track{animation-play-state:paused}
  @keyframes slide{to{transform:translateX(calc(-50% - 9px))}}
  .frame{
    height:100%;aspect-ratio:16/10;flex:0 0 auto;background:#fff;border-radius:10px;
    border:1px solid var(--line);box-shadow:0 10px 28px -14px rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;
  }
  .frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:6px}

  @media (prefers-reduced-motion:reduce){ .track{--speed:180s} .glow{animation:none} }

  /* narrow embeds: stack */
  @media (max-width:760px){
    body{overflow:auto}
    a.wrap{flex-direction:column;height:auto}
    .copy{max-width:none;min-width:0;flex:none}
    .stage{height:200px;flex:none}
  }
</style>
</head>
<body>
<a class="wrap" href="https://notomantra.gumroad.com/l/architects" target="_blank" rel="noopener">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

  <div class="copy">
    <div class="eyebrow">Architecture Firm OS</div>
    <h1>Your practice, <em>drawn in one place.</em></h1>
    <p class="sub">Projects, phases, drawings, revisions, clients and fees, all connected. Built for solo architects and small studios.</p>
    <div class="chips">
      <span class="chip">Projects</span>
      <span class="chip">Drawing revisions</span>
      <span class="chip">Clients &amp; fees</span>
    </div>
    <div class="cta">
      <span class="btn">Get the full system <span>→</span></span>
    </div>
  </div>

  <div class="stage">
    <div class="track">
      <div class="frame"><img src="https://public-files.gumroad.com/qxpruq6kowrnlnn2rw1ohod9ph9y" alt="Architecture Firm OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/3itlli9h4zi4xivqpjlzly1eo990" alt="Architecture Firm OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/exmpt9zs6cvhs4ak9muhk9a54gpe" alt="Architecture Firm OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/0n0gbh1p8srg9c33cbkm68yewf90" alt="Architecture Firm OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/wn79wyuytvmlv189nhs3k3dgh5ui" alt="Architecture Firm OS screen"></div>
      <!-- duplicate set for a seamless loop -->
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/qxpruq6kowrnlnn2rw1ohod9ph9y" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/3itlli9h4zi4xivqpjlzly1eo990" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/exmpt9zs6cvhs4ak9muhk9a54gpe" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/0n0gbh1p8srg9c33cbkm68yewf90" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/wn79wyuytvmlv189nhs3k3dgh5ui" alt=""></div>
    </div>
  </div>
</a>
</body>
</html>
