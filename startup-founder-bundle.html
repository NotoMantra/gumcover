<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Startup Founder Bundle</title>
<style>
  /* ============================================================
     NotoMantra freemium upsell widget — ULTRA THIN, WIDE
     Bundle framing: integrated Startup Playbook + standalone
     products, each a complete system with its own submodules.
     HOW TO REUSE:
     1. Change the href on <a class="card"> to your product link.
     2. Change the <img src> to your full cover image.
     3. Edit name / pill / the two liners below.
     4. Keep it to two lines max or it stops being thin.
     ============================================================ */
  :root{
    --ink:#1a1a1a;
    --accent:#2b2b2b;
    --cream:#fafafa;
    --panel:#f4f4f4;
    --stroke:#e6e6e6;
    --muted:#767676;
    --text:#2c2c2c;
    --cardbg:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .card{
    width:100%;
    max-width:1080px;
    display:grid;
    grid-template-columns:188px 1fr auto;
    align-items:stretch;
    background:var(--cardbg);
    border:1px solid var(--stroke);
    border-radius:16px;
    overflow:hidden;
    text-decoration:none;
    box-shadow:0 4px 18px rgba(0,0,0,0.07);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,0.14)}

  /* LEFT — thin cover strip */
  .cover{
    position:relative;
    background:linear-gradient(135deg,#f2f2f2 0%,#e4e4e4 100%);
    border-right:1px solid var(--stroke);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .cover img{
    display:block;
    max-width:100%;max-height:120px;
    width:auto;height:auto;object-fit:contain;
    border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,0.20);
  }

  /* CENTER — name + two liners */
  .info{
    padding:20px 24px;
    display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0;
  }
  .toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .name{font-size:21px;line-height:1.15;font-weight:800;letter-spacing:-0.01em;color:var(--ink)}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--stroke);color:var(--ink);
    font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;white-space:nowrap;
  }
  .pill .spark{color:var(--accent)}
  .line{font-size:13px;line-height:1.45;color:var(--muted)}
  .line.lead{color:var(--text);font-weight:500}

  /* RIGHT — CTA rail */
  .cta-rail{display:flex;align-items:center;padding:0 24px;border-left:1px solid var(--stroke)}
  .cta{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
    background:var(--ink);color:var(--cream);
    font-size:14px;font-weight:700;padding:12px 22px;border-radius:10px;letter-spacing:.2px;
    transition:background .2s ease;
  }
  .card:hover .cta{background:#000}

  @media (max-width:720px){
    .card{grid-template-columns:1fr;max-width:460px}
    .cover{border-right:none;border-bottom:1px solid var(--stroke);padding:20px}
    .cover img{max-height:150px}
    .cta-rail{border-left:none;border-top:1px solid var(--stroke);padding:16px 24px}
    .cta{width:100%}
  }
</style>
</head>
<body>

  <a class="card" href="https://notomantra.gumroad.com/l/startup-founder-bundle" target="_blank" rel="noopener">

    <div class="cover">
      <img src="https://public-files.gumroad.com/r8sw3w47u9yzqfrh5wv1k19xr4bd" alt="Startup Founder Bundle cover"/>
    </div>

    <div class="info">
      <div class="toprow">
        <span class="name">Startup Founder Bundle</span>
        <span class="pill"><span class="spark">&#10022;</span> Playbook + standalone tools</span>
      </div>
      <div class="line lead">An integrated Startup Playbook plus a set of independent, standalone products, all in one upgrade.</div>
      <div class="line">Every product is a complete system on its own, each with its own submodules inside. Use one, or run them all together.</div>
    </div>

    <div class="cta-rail">
      <span class="cta">Get the bundle &#8594;</span>
    </div>

  </a>

</body>
</html>
