<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--brown:#9F6B53;--ink:#37352F;--soft:#7d6a60;--tint:rgba(159,107,83,.04);--line:rgba(159,107,83,.35);--red:#C4554D;--green:#448361}
@media (prefers-color-scheme:dark){:root{--brown:#BA856F;--ink:#E6E1DC;--soft:#a8968c;--tint:rgba(186,133,111,.05);--line:rgba(186,133,111,.4);--red:#E06B63;--green:#5FA57D}}
*{box-sizing:border-box;margin:0}
html,body{background:transparent;height:100%}
body{font-family:'Lora',Georgia,serif;color:var(--ink);padding:6px;display:flex}
.card{flex:1;border:3px solid var(--brown);border-radius:16px;background:var(--tint);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;color:var(--brown);line-height:1.1}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{flex:1;min-width:110px;font-size:12px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
input{font-family:'Lora',Georgia,serif;font-size:16px;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input:focus{outline:none;border-color:var(--brown)}
.big{text-align:center}
.num{font-family:'Fraunces',Georgia,serif;font-size:52px;font-weight:500;color:var(--brown);line-height:1;font-variant-numeric:tabular-nums}
.cap{font-size:13px;color:var(--soft);font-style:italic}
.bar{height:10px;border:2px solid var(--brown);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:var(--brown);transition:width .3s}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats .n{font-family:'Fraunces',Georgia,serif;font-size:20px;color:var(--brown);font-variant-numeric:tabular-nums}
.verdict{text-align:center;font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:600}
.v-green{color:var(--green)}.v-red{color:var(--red)}.v-brown{color:var(--brown)}
.hint{font-size:12px;color:var(--soft);font-style:italic;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div><div class="eyebrow">Fanfic Writer</div><h1>Update Countdown</h1></div>
  <div class="row">
    <label>Next update<input id="due" type="date"></label>
  </div>
  <div class="row">
    <label>Chapter goal<input id="goal" type="number" min="0" inputmode="numeric" placeholder="4000"></label>
    <label>Words drafted<input id="done" type="number" min="0" inputmode="numeric" placeholder="1450"></label>
  </div>
  <div class="big"><div class="num" id="days">–</div><div class="cap" id="dcap">days until your readers get a chapter</div></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="stats">
    <div><div class="n" id="left">0</div><div class="cap">words left</div></div>
    <div><div class="n" id="pace">0</div><div class="cap">words a day</div></div>
    <div><div class="n" id="pct">0%</div><div class="cap">drafted</div></div>
  </div>
  <div class="verdict v-brown" id="verdict">Add your next update date.</div>
  <div class="hint">Leave a day for your beta. Readers forgive late, not silent.</div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  var ids=['due','goal','done'];
  ids.forEach(function(id){var v=store.get('ffw-count-'+id);if(v)$(id).value=v});
  function fmt(n){return n.toLocaleString('en-US')}
  function run(){
    var g=parseInt($('goal').value,10)||0,d=parseInt($('done').value,10)||0;
    var left=Math.max(0,g-d),pct=g?Math.min(100,Math.round(d/g*100)):0;
    $('left').textContent=fmt(left);$('pct').textContent=pct+'%';$('fill').style.width=pct+'%';
    var v=$('verdict');
    if(!$('due').value){$('days').textContent='–';$('pace').textContent='0';v.textContent='Add your next update date.';v.className='verdict v-brown';return}
    var p=$('due').value.split('-'),due=new Date(+p[0],+p[1]-1,+p[2]),t=new Date();t.setHours(0,0,0,0);
    var days=Math.round((due-t)/86400000);
    $('days').textContent=Math.max(0,days);
    $('dcap').textContent=days===1?'day until your readers get a chapter':'days until your readers get a chapter';
    var writeDays=Math.max(1,days-1);
    var pace=left?Math.ceil(left/writeDays):0;$('pace').textContent=fmt(pace);
    if(!g){v.textContent='Add a chapter goal to see your pace.';v.className='verdict v-brown';return}
    if(left===0){v.textContent=days>=0?'Drafted. Send it to your beta.':'Drafted. Post it.';v.className='verdict v-green';return}
    if(days<0){v.textContent='Update day has passed. Post a quick note to readers.';v.className='verdict v-red';return}
    if(days===0){v.textContent='Update day is today, '+fmt(left)+' words short.';v.className='verdict v-red';return}
    if(pace>1500){v.textContent='Tight. Move the date or split the chapter.';v.className='verdict v-red'}
    else if(pace>700){v.textContent='Doable with a writing slot every day.';v.className='verdict v-brown'}
    else{v.textContent='On track, with a day spare for your beta.';v.className='verdict v-green'}
  }
  ids.forEach(function(id){$(id).addEventListener('input',function(){store.set('ffw-count-'+id,this.value);run()})});
  run();
})();
</script>
</body>
</html>
