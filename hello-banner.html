<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello</title>
<style>

*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:6px;color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.card{border:1.5px solid var(--line);border-radius:var(--r1);padding:16px 18px 18px;background:var(--wash);max-width:560px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.hr{display:flex;align-items:center;gap:4px;min-width:0}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--g);font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);flex:none}
.sub{font-size:12.5px;color:var(--mute)}
.gear{border:none;background:none;color:var(--mute);cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center;opacity:.7}
.gear:hover{color:var(--g);opacity:1}
.gear svg{width:16px;height:16px}
input[type=text],input[type=time],input[type=number],input[type=date],input[type=search],textarea,select{width:100%;border:1.5px solid var(--line2);border-radius:var(--r3);padding:10px 12px;background:transparent;color:var(--ink);font:inherit;outline:none;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:76px;line-height:1.4}
input::placeholder,textarea::placeholder{color:var(--mute)}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
input[type=time],input[type=date]{color-scheme:light dark}
.btn{border:1.5px solid var(--line);border-radius:var(--rb);padding:8px 15px;background:transparent;color:var(--g);font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:var(--wash2)}
.btn.solid{background:var(--g);color:var(--on-g);border-color:var(--g)}
.btn:active{transform:scale(.96)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.on{background:var(--wash2)}
.btn.wide{width:100%;padding:11px 15px;font-size:15px}
.ghost{border:none;background:none;color:var(--mute);cursor:pointer;font:inherit;font-size:13px;padding:4px 6px;border-radius:8px}
.ghost:hover{color:var(--g)}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:var(--r2);margin-top:8px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s}
.item:hover{border-color:var(--line)}
.item.on{background:var(--wash2);border-color:var(--line)}
.item.static{cursor:default}
.box{width:22px;height:22px;border-radius:min(8px,var(--r3));border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.item.on .box{background:var(--g);border-color:var(--g)}
.item.on .box::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-g);border-bottom:2px solid var(--on-g);transform:translateY(-1px) rotate(-45deg)}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item.on .txt{color:var(--mute)}
.strike .item.on .txt{text-decoration:line-through;text-decoration-color:var(--line)}
.x{border:none;background:none;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--g)}
.chip{display:inline-block;border:1.5px solid var(--line2);border-radius:var(--rb);padding:5px 11px;font-size:13px;margin:6px 6px 0 0;cursor:pointer;color:var(--ink);background:transparent;font-family:inherit}
.chip:hover{border-color:var(--line);background:var(--wash2)}
.chip.on{background:var(--g);border-color:var(--g);color:var(--on-g)}
.tag{display:inline-block;border-radius:var(--rb);padding:2px 9px;font-size:12px;font-weight:600;background:var(--wash2);color:var(--g);white-space:nowrap}
.tag.hot{background:var(--g);color:var(--on-g)}
.msg{margin-top:12px;padding:10px 12px;border-radius:var(--r3);background:var(--wash2);color:var(--g);font-weight:600;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.empty{color:var(--mute);font-size:14px;padding:10px 2px}
.bar{height:8px;border-radius:var(--rb);background:var(--wash2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--g);border-radius:var(--rb);transition:width .4s linear}
.big{font-size:22px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.fade{animation:f .35s ease}
@keyframes f{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.pulse{animation:p 1.6s ease-in-out infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 0 var(--line2)}50%{box-shadow:0 0 0 8px transparent}}
.cfg .grp{margin-top:14px}
.cfg .grp:first-child{margin-top:0}
.cfg .gt{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--g);font-weight:700;margin-bottom:6px}
.cfg .f{margin-top:10px}
.cfg .fl{font-size:13px;color:var(--mute);margin-bottom:4px;display:block}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;outline:2px solid transparent;outline-offset:2px}
.sw button.on{outline-color:var(--ink)}
.swl{font-size:11.5px;color:var(--mute);margin:8px 0 5px}
.swl:first-child{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.tg input{width:18px;height:18px;accent-color:var(--g)}
input[type=range]{width:100%;accent-color:var(--g)}

body{padding:6px}
.wide{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:var(--r1);background:var(--wash);overflow:hidden;width:100%}
.half{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;padding:18px 22px;color:inherit;text-decoration:none;cursor:pointer;transition:background .18s}
.half:hover,.half:focus-visible{background:var(--wash2);outline:none}
.half.r{text-align:right;align-items:flex-end}
.mid{width:1.5px;background:var(--line2);margin:16px 0;flex:none}
.kick{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--g);font-weight:700;display:flex;gap:8px;align-items:center}
.half.l .kick::before,.half.r .kick::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);flex:none}
.hello{font-size:clamp(20px,3.2vw,30px);font-weight:700;line-height:1.2;letter-spacing:-.01em}
.tip{font-size:clamp(15px,2vw,19px);font-weight:600;line-height:1.35;max-width:46ch}
.meta{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.cta{margin-top:auto;padding-top:8px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:var(--rb);padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--g);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;transition:background .18s,color .18s}
.half:hover .pill{background:var(--g);color:var(--on-g);border-color:var(--g)}
.pill .ar{transition:transform .18s}
.half:hover .pill .ar{transform:translateX(3px)}
.half.l .pill .ar{order:2}
@media (max-width:560px){.wide{flex-direction:column}.mid{width:auto;height:1.5px;margin:0 16px}.half.r{text-align:left;align-items:flex-start}.half.r .kick{flex-direction:row-reverse;justify-content:flex-end}.half{padding:16px 18px}}

function applyLook(L){L=L||look;const dark=L.theme==='dark'||(L.theme==='auto'&&mq.matches);const c=(ACC[L.accent]||ACC.green)[dark?1:0];const r=document.documentElement.style;

 r.setProperty('--font',FONTS[L.font]||FONTS.system);const k=CORN[L.corner]||CORN.round;['--r1','--r2','--r3','--rb'].forEach((v,i)=>r.setProperty(v,k[i]));document.documentElement.style.colorScheme=dark?'dark':'light'}

function slot(h){return SLOTS.find(s=>h>=s[0]&&h<s[1])}
function doy(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
function paint(){const d=new Date(),s=slot(d.getHours());
 $('#k1').textContent=s[2];$('#hi').textContent=s[3];
 $('#dt').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+' · '+clock(d);
 $('#k2').textContent=s[4];const t=s[5];$('#tip').textContent=t[(doy(d)+d.getHours())%t.length];$('#nt').textContent=s[6];}
window.addEventListener('storage',e=>{if(e.key===NS+'look'){look=Object.assign({},LOOK0,S.get('look',{}));applyLook();paint()}});
paint();setInterval(paint,30000);
