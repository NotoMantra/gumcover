<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- LIGHT (default) ---------- */
  :root,
  [data-theme="light"]{
    --surface:#FBF7F2;
    --surface-2:#FFFFFF;
    --edge:#EBE2D7;
    --edge-soft:#F2EAE0;
    --text:#2A2228;
    --text-2:#7A6C74;
    --text-3:#9C8E96;
    --gold:#E8A02C;
    --gold-hot:#F5B23E;
    --gold-dead:#E3DAD0;
    --btn-bg:#2A2228;
    --btn-text:#FBF7F2;
    --btn-bg-hot:#3D323A;
    --bloom:rgba(232,160,44,.10);
  }
  /* ---------- DARK ---------- */
  [data-theme="dark"]{
    --surface:#241A2A;
    --surface-2:#2E2135;
    --edge:rgba(246,239,230,.10);
    --edge-soft:rgba(246,239,230,.07);
    --text:#F4EDE6;
    --text-2:#A897AE;
    --text-3:#87748D;
    --gold:#F5B23E;
    --gold-hot:#FFC85C;
    --gold-dead:#544;
    --gold-dead:#4E3A2C;
    --btn-bg:#F5B23E;
    --btn-text:#2A1A0A;
    --btn-bg-hot:#FFC85C;
    --bloom:rgba(245,178,62,.13);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:transparent;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:4px;
  }

  .bar{
    width:100%;
    background:var(--surface);
    border:1px solid var(--edge);
    border-radius:16px;
    padding:22px 26px;
    display:grid;
    grid-template-columns:auto 1px 1fr auto;
    align-items:center;
    gap:26px;
    position:relative;
    overflow:hidden;
  }
  /* the one flourish: warmth blooms behind the stars only once touched */
  .bar::before{
    content:"";
    position:absolute;
    left:-50px;top:50%;
    width:300px;height:300px;
    transform:translateY(-50%);
    background:radial-gradient(circle, var(--bloom) 0%, transparent 65%);
    pointer-events:none;
    opacity:0;
    transition:opacity .5s ease;
  }
  .bar.warm::before{opacity:1}
  .rule{
    width:1px;height:44px;
    background:var(--edge-soft);
  }

  /* ---- stars: the signature ---- */
  .stars{display:flex;gap:4px;align-items:center;flex-shrink:0;position:relative}
  .star{
    background:none;border:0;padding:2px;cursor:pointer;
    line-height:0;border-radius:6px;
    transition:transform .18s cubic-bezier(.34,1.7,.64,1);
  }
  .star svg{width:30px;height:30px;display:block}
  .star path{fill:var(--gold-dead);transition:fill .2s ease}
  .star.lit path{fill:var(--gold)}
  .star.lit{transform:scale(1.09)}
  .star.hot path{fill:var(--gold-hot)}
  .star:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* ---- copy ---- */
  .copy{min-width:0}
  .ask{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-weight:700;
    font-size:17.5px;
    letter-spacing:-.015em;
    color:var(--text);
    line-height:1.3;
  }
  .sub{
    margin-top:5px;
    font-size:13px;
    line-height:1.5;
    color:var(--text-2);
  }
  .sub b{color:var(--text);font-weight:600}
  .proof{
    margin-top:9px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:11.5px;font-weight:500;
    color:var(--text-3);
    letter-spacing:.015em;
  }
  .proof:empty{display:none}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--edge);flex-shrink:0}

  /* ---- cta ---- */
  .act{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex-shrink:0}
  .go{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--btn-bg);
    color:var(--btn-text);
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-weight:700;font-size:14px;letter-spacing:-.005em;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    white-space:nowrap;
    transition:transform .18s cubic-bezier(.34,1.7,.64,1), background .18s ease, box-shadow .22s ease;
  }
  .go:hover{background:var(--btn-bg-hot);transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
  .go:active{transform:translateY(0)}
  .go:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .go svg{width:14px;height:14px;flex-shrink:0}
  .fix{
    font-size:11.5px;color:var(--text-3);text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color .16s ease,border-color .16s ease;
  }
  .fix:hover{color:var(--text);border-color:var(--edge)}

  @media (max-width:840px){
    .bar{grid-template-columns:1fr;gap:16px;padding:22px;text-align:center;justify-items:center}
    .rule{width:60px;height:1px}
    .act{align-items:stretch;width:100%}
    .proof{justify-content:center}
    .go{width:100%;justify-content:center}
    .fix{text-align:center}
    .bar::before{left:50%;top:-70px;transform:translateX(-50%)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .star.lit{transform:none}
  }
</style>
</head>
<body>

<div class="bar" id="bar" data-theme="light">
  <div class="stars" id="stars" role="group" aria-label="Rate this template"></div>
  <div class="rule"></div>
  <div class="copy">
    <div class="ask" id="ask">Made by one person. Not a company.</div>
    <div class="sub" id="sub">
      Ratings are the only reason this gets found by the next person who needs it.
      <b>Stars only, no writing needed.</b> Takes about 8 seconds.
    </div>
    <div class="proof" id="proof"></div>
  </div>
  <div class="act">
    <a class="go" id="go" target="_blank" rel="noopener" href="#">
      <span id="go-label">Rate this template</span>
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <a class="fix" id="fix" target="_blank" rel="noopener" href="#">Something broken? Tell me first, I'll fix it</a>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   CONFIG — the only part you edit
   ═══════════════════════════════════════════════════ */
const CONFIG = {

  // Buyer's Reviews page inside their Gumroad Library.
  reviewUrl : "https://app.gumroad.com/reviews",

  // Where a broken-thing email goes.
  supportUrl: "mailto:hello@notomantra.com?subject=Issue%20with%20my%20template",

  // "light" or "dark". Light is safer inside a normal Notion page.
  theme     : "light",

  // Numbers are OFF by default so this is safe to drop on a brand new
  // template. Only fill these in when they are TRUE for that product.
  // Leave the array empty and the row disappears cleanly.
  //   proof: ["1,000+ downloads", "Rated 4.95 / 5"]
  proof     : []

};
/* ═══════════════════════════════════════════════════ */

const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.25l-5.81 3.05L7.3 13.83 2.6 9.25l6.5-.95L12 2.4z"/></svg>';

const bar   = document.getElementById('bar');
const wrap  = document.getElementById('stars');
const go    = document.getElementById('go');
const label = document.getElementById('go-label');
const ask   = document.getElementById('ask');
const sub   = document.getElementById('sub');
const proof = document.getElementById('proof');

bar.setAttribute('data-theme', CONFIG.theme === 'dark' ? 'dark' : 'light');
go.href  = CONFIG.reviewUrl;
document.getElementById('fix').href = CONFIG.supportUrl;

/* Proof row: always ends with the location, since that is true everywhere
   and it is the thing that removes the "where do I even do this" friction. */
const claims = [...(CONFIG.proof || []), "Rate from your Gumroad Library"];
claims.forEach((t, i) => {
  if (i) { const d = document.createElement('span'); d.className = 'dot'; proof.appendChild(d); }
  const s = document.createElement('span'); s.textContent = t; proof.appendChild(s);
});

let locked = 0;

for (let i = 1; i <= 5; i++) {
  const b = document.createElement('button');
  b.className = 'star';
  b.type = 'button';
  b.innerHTML = STAR;
  b.setAttribute('aria-label', i + (i === 1 ? ' star' : ' stars'));
  b.addEventListener('mouseenter', () => paint(i, true));
  b.addEventListener('focus',      () => paint(i, true));
  b.addEventListener('click',      () => pick(i));
  wrap.appendChild(b);
}

wrap.addEventListener('mouseleave', () => paint(locked, false));
wrap.addEventListener('mouseenter', () => bar.classList.add('warm'));

function paint(n, hot) {
  [...wrap.children].forEach((s, idx) => {
    const on = idx < n;
    s.classList.toggle('lit', on);
    s.classList.toggle('hot', on && hot);
  });
}

/* Every rating, 1 through 5, goes to the same URL. No gating.
   The click here is the commitment. Gumroad is where it gets confirmed. */
function pick(n) {
  locked = n;
  paint(n, false);
  bar.classList.add('warm');
  ask.textContent = n >= 4 ? "Thank you. Genuinely." : "Thanks for being honest.";
  sub.innerHTML = n >= 4
    ? "One more click to lock it in on Gumroad. Opens in a new tab."
    : "Confirm it on Gumroad. And if something is wrong, tell me and I will fix it.";
  label.textContent = "Confirm " + n + (n === 1 ? " star" : " stars");
  // Real anchor click — survives the iframe sandbox that blocks window.open()
  go.click();
}
</script></body></html>
