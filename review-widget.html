<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211428;
    --ink-lift:#2f1c38;
    --edge:rgba(246,239,230,.10);
    --gold:#F5B23E;
    --gold-hot:#FFC85C;
    --gold-dead:#5d4527;
    --cream:#F6EFE6;
    --muted:#A08FA6;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:transparent;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:6px;
    display:flex;
    align-items:center;
  }

  .bar{
    width:100%;
    background:
      radial-gradient(120% 180% at 8% 50%, #3a2244 0%, var(--ink) 55%),
      var(--ink);
    border:1px solid var(--edge);
    border-radius:var(--r);
    padding:20px 26px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:32px;
    position:relative;
    overflow:hidden;
  }
  /* faint gold bloom behind the stars — the one flourish */
  .bar::before{
    content:"";
    position:absolute;
    left:-40px;top:50%;
    width:280px;height:280px;
    transform:translateY(-50%);
    background:radial-gradient(circle, rgba(245,178,62,.13) 0%, transparent 65%);
    pointer-events:none;
    opacity:0;
    transition:opacity .45s ease;
  }
  .bar.warm::before{opacity:1}

  /* ---- stars ---- */
  .stars{display:flex;gap:5px;align-items:center;flex-shrink:0}
  .star{
    background:none;border:0;padding:2px;cursor:pointer;
    line-height:0;border-radius:6px;
    transition:transform .16s cubic-bezier(.34,1.6,.64,1);
  }
  .star svg{width:31px;height:31px;display:block}
  .star path{
    fill:var(--gold-dead);
    transition:fill .18s ease;
  }
  .star.lit path{fill:var(--gold)}
  .star.lit{transform:scale(1.1)}
  .star.hot path{fill:var(--gold-hot)}
  .star:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* ---- copy ---- */
  .copy{min-width:0}
  .ask{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:-.02em;
    color:var(--cream);
    line-height:1.25;
  }
  .sub{
    margin-top:5px;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
  }
  .sub b{color:#D8C6DD;font-weight:600}
  .proof{
    margin-top:9px;
    display:flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:500;
    color:#8E7A94;
    letter-spacing:.02em;
  }
  .dot{width:3px;height:3px;border-radius:50%;background:#5c4a63;flex-shrink:0}

  /* ---- cta ---- */
  .act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
  .go{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--gold);
    color:#2A1A0A;
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:-.01em;
    padding:13px 22px;
    border:0;border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .16s cubic-bezier(.34,1.6,.64,1), background .16s ease, box-shadow .2s ease;
    box-shadow:0 0 0 0 rgba(245,178,62,0);
  }
  .go:hover{background:var(--gold-hot);transform:translateY(-1px);box-shadow:0 6px 22px -6px rgba(245,178,62,.55)}
  .go:active{transform:translateY(0)}
  .go:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
  .go svg{width:14px;height:14px;flex-shrink:0}
  .fix{
    font-size:11.5px;
    color:#8E7A94;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color .16s ease,border-color .16s ease;
  }
  .fix:hover{color:var(--cream);border-color:#6b586f}

  @media (max-width:820px){
    .bar{grid-template-columns:1fr;gap:18px;padding:22px;text-align:center}
    .stars{justify-content:center}
    .act{align-items:center}
    .proof{justify-content:center}
    .go{width:100%;justify-content:center}
    .bar::before{left:50%;top:-60px;transform:translateX(-50%)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
    .star.lit{transform:none}
  }
</style>
</head>
<body>

<div class="bar" id="bar">

  <div class="stars" id="stars" role="group" aria-label="Rate this template"></div>

  <div class="copy">
    <div class="ask" id="ask">Built by one person. Not a company.</div>
    <div class="sub" id="sub">
      Ratings are the only reason this template gets found by the next person who needs it.
      <b>Stars only, no writing needed.</b> Takes about 8 seconds.
    </div>
    <div class="proof">
      <span id="proof-a">1,000+ people use this</span>
      <span class="dot"></span>
      <span>Rated 4.95 / 5</span>
      <span class="dot"></span>
      <span>Rate from your Gumroad Library</span>
    </div>
  </div>

  <div class="act">
    <button class="go" id="go">
      <span id="go-label">Rate this template</span>
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <a class="fix" id="fix" href="#" target="_blank" rel="noopener">Something broken? Tell me first, I'll fix it</a>
  </div>

</div>

<script>
/* ─────────────────────────────────────────────
   CONFIG — edit these four lines per product
   ───────────────────────────────────────────── */
const CONFIG = {
  // Buyer's Reviews page inside their Gumroad Library.
  reviewUrl : "https://app.gumroad.com/reviews",
  // Your support address. Catches the 1-star before it lands.
  supportUrl: "mailto:hello@notomantra.com?subject=Issue%20with%20my%20template",
  // Social proof. Keep these honest and current.
  users     : "1,000+ people use this",
  rating    : "4.95 / 5"
};
/* ───────────────────────────────────────────── */

const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.25l-5.81 3.05L7.3 13.83 2.6 9.25l6.5-.95L12 2.4z"/></svg>';

const bar   = document.getElementById('bar');
const wrap  = document.getElementById('stars');
const go    = document.getElementById('go');
const label = document.getElementById('go-label');
const ask   = document.getElementById('ask');
const sub   = document.getElementById('sub');

document.getElementById('fix').href = CONFIG.supportUrl;
document.getElementById('proof-a').textContent = CONFIG.users;

let locked = 0;

for (let i = 1; i <= 5; i++) {
  const b = document.createElement('button');
  b.className = 'star';
  b.type = 'button';
  b.innerHTML = STAR;
  b.setAttribute('aria-label', i + (i === 1 ? ' star' : ' stars'));
  b.addEventListener('mouseenter', () => paint(i, true));
  b.addEventListener('focus',      () => paint(i, true));
  b.addEventListener('click',      () => pick(i));
  wrap.appendChild(b);
}

wrap.addEventListener('mouseleave', () => paint(locked, false));
wrap.addEventListener('mouseenter', () => bar.classList.add('warm'));

function paint(n, hot) {
  [...wrap.children].forEach((s, idx) => {
    const on = idx < n;
    s.classList.toggle('lit', on);
    s.classList.toggle('hot', on && hot);
  });
}

/* Every rating goes to the same place. No gating, no filtering.
   The click here is the commitment; Gumroad is where it's confirmed. */
function pick(n) {
  locked = n;
  paint(n, false);
  bar.classList.add('warm');
  ask.textContent = n >= 4 ? "Thank you. Genuinely." : "Thanks for being honest.";
  sub.innerHTML = n >= 4
    ? "One more click to lock it in on Gumroad. Your library opens in a new tab."
    : "Confirm it on Gumroad, and if something's wrong, tell me and I'll fix it.";
  label.textContent = "Confirm " + n + (n === 1 ? " star" : " stars") + " on Gumroad";
  open();
}

go.addEventListener('click', open);

function open() {
  window.open(CONFIG.reviewUrl, '_blank', 'noopener');
}
</script>
</body>
</html>
