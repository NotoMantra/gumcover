<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD Life OS Ultimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#f4f0fb; --bg2:#ece5f8; --ink:#2a2140; --muted:#6e6487;
    --accent:#7b5cc4; --accent-deep:#6646b0; --chip:#e3d9f5; --line:#ddd2f0;
    --speed:70s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg1)}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden}

  a.wrap{
    position:relative;display:flex;align-items:stretch;height:100vh;
    text-decoration:none;color:inherit;overflow:hidden;border-radius:14px;
    background:linear-gradient(120deg,var(--bg1) 0%,var(--bg2) 55%,#efe8fa 100%);
    border:1px solid var(--line);
  }
  /* slow drifting glow */
  .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7;pointer-events:none}
  .g1{width:380px;height:380px;background:#e2d4fb;top:-160px;left:-80px;animation:drift1 26s ease-in-out infinite alternate}
  .g2{width:420px;height:420px;background:#e8dcfa;bottom:-220px;left:38%;animation:drift2 32s ease-in-out infinite alternate}
  .g3{width:300px;height:300px;background:#dccdf7;top:-120px;right:-60px;animation:drift1 30s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(90px,50px) scale(1.12)}}
  @keyframes drift2{to{transform:translate(-110px,-40px) scale(1.08)}}

  /* copy panel */
  .copy{
    position:relative;z-index:2;flex:0 0 34%;max-width:440px;
    padding:clamp(16px,3.2vh,30px) clamp(18px,2.4vw,34px);
    display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.6vh,12px);
  }
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(19px,4.4vh,30px);line-height:1.15;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{font-size:clamp(12px,2.1vh,14px);line-height:1.5;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:500;color:#4b3a78;background:var(--chip);padding:4px 10px;border-radius:999px}
  .cta{display:flex;align-items:center;gap:12px;margin-top:2px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
    font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;
    box-shadow:0 6px 18px -6px rgba(102,70,176,.45);transition:background .25s,transform .25s;
  }
  a.wrap:hover .btn{background:var(--accent-deep);transform:translateY(-1px)}
  .btn span{transition:transform .25s}
  a.wrap:hover .btn span{transform:translateX(3px)}

  /* carousel */
  .stage{
    position:relative;z-index:1;flex:1;overflow:hidden;display:flex;align-items:center;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
  }
  .track{display:flex;gap:18px;width:max-content;height:100%;align-items:center;
    padding:clamp(12px,3vh,22px) 0;animation:slide var(--speed) linear infinite}
  a.wrap:hover .track{animation-play-state:paused}
  @keyframes slide{to{transform:translateX(calc(-50% - 9px))}}
  .frame{
    height:100%;aspect-ratio:16/10;flex:0 0 auto;background:#fff;border-radius:10px;
    border:1px solid var(--line);box-shadow:0 10px 28px -14px rgba(75,58,120,.35);
    display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;
  }
  .frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:6px}

  @media (prefers-reduced-motion:reduce){ .track{--speed:180s} .glow{animation:none} }

  /* never show scrollbars, whatever size the embed is */
  html,body{overflow:hidden;width:100%}
  a.wrap{width:100%;min-width:0}
  .copy{min-width:0}
  .stage{min-width:0;min-height:0}
  h1,.sub{overflow-wrap:anywhere}

  /* medium widths: give the copy less room */
  @media (max-width:1000px){
    .copy{flex-basis:40%;max-width:none}
  }

  /* narrow embeds: stack, but stay inside the frame */
  @media (max-width:760px){
    a.wrap{flex-direction:column;height:100vh}
    .copy{flex:0 0 auto;max-width:none;padding:14px 16px 6px;gap:6px}
    .stage{flex:1 1 auto;min-height:0}
    .track{padding:8px 0 12px}
    .sub{display:none}
  }

  /* short embeds: drop the extras so nothing gets cut */
  @media (max-height:300px){
    .sub{display:none}
  }
  @media (max-height:230px){
    .chips{display:none}
  }
  @media (max-width:760px) and (max-height:340px){
    .chips{display:none}
    h1{font-size:18px}
  }
  @media (max-width:420px){
    .chips{display:none}
    .btn{padding:8px 14px;font-size:13px}
  }
</style>
</head>
<body>
<a class="wrap" href="https://notomantra.gumroad.com/l/adhd-life-pro" target="_blank" rel="noopener">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

  <div class="copy">
    <div class="eyebrow">ADHD Life OS Ultimate</div>
    <h1>Built for the ADHD brain, <em>not against it.</em></h1>
    <p class="sub">Tasks, routines, goals and the stuff you keep forgetting, all in one calm place. For people who have tried every other template.</p>
    <div class="chips">
      <span class="chip">Tasks</span>
      <span class="chip">Routines</span>
      <span class="chip">Goals</span>
    </div>
    <div class="cta">
      <span class="btn">Get the full system <span>→</span></span>
    </div>
  </div>

  <div class="stage">
    <div class="track">
      <div class="frame"><img src="https://public-files.gumroad.com/f2m3s6pwju4yq1ztghqmdo8ugkq9" alt="ADHD Life OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/1mqtqkt4219xxkm7kupufu0ajba4" alt="ADHD Life OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/e9ck5s8c4u545mb7qos5or242cwc" alt="ADHD Life OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/dtk0oa0xc8ea1ahbnw48bkw6phpa" alt="ADHD Life OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/m6e0znqhuayqxmsr8nriqwoe3v6g" alt="ADHD Life OS screen"></div>
      <div class="frame"><img src="https://public-files.gumroad.com/2z8gnr8iydcctawdfx2uflonoj5h" alt="ADHD Life OS screen"></div>
      <!-- duplicate set for a seamless loop -->
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/f2m3s6pwju4yq1ztghqmdo8ugkq9" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/1mqtqkt4219xxkm7kupufu0ajba4" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/e9ck5s8c4u545mb7qos5or242cwc" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/dtk0oa0xc8ea1ahbnw48bkw6phpa" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/m6e0znqhuayqxmsr8nriqwoe3v6g" alt=""></div>
      <div class="frame" aria-hidden="true"><img src="https://public-files.gumroad.com/2z8gnr8iydcctawdfx2uflonoj5h" alt=""></div>
    </div>
  </div>
</a>
</body>
</html>
